[package]
name = "kube-nftpolicy"
version = "0.1.0"
edition = "2024"
description = "Kubernetes NetworkPolicy enforced in nftables, IPv4 only, on each node"
license = "Apache-2.0"
repository = "https://github.com/daveman1010221/kube-nftpolicy"
readme = "README.md"

[[bin]]
name = "kube-nftpolicy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.27", features = ["v1_35"] }
kube = { version = "3.1.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["std", "env-filter"] }

[dev-dependencies]
proptest = "1.10.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
